[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-scorecard"
version = "1.0.0"
description = "Local-first CLI to score resale suppliers on price, speed, and quality"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [{name = "Asdale Dynamics, LLC"}]
keywords = ["supplier", "scorecard", "reselling", "cli", "local-first"]

[project.scripts]
supplier-scorecard = "supplier_scorecard.cli:main"

[tool.setuptools]
packages = ["supplier_scorecard"]
